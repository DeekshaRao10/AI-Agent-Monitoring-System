[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino

monitor_speed = 115200
board_build.partitions = huge_app.csv

upload_port = COM5
monitor_port = COM5
; Slower than the board default (often 921600) — that speed is too fast
; for the initial reset/sync handshake on some USB-serial chips/cables,
; causing esptool's "No serial data received" even though the port and
; board are both fine. Only affects upload time (adds maybe 20-30s),
; not runtime behavior.
upload_speed = 115200

lib_deps =
    h2zero/NimBLE-Arduino
    bblanchon/ArduinoJson
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor